name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Resolve Version and Tag
        id: version_info
        run: |
          VERSION_NAME=$(grep 'versionName = ' app/build.gradle.kts | head -n1 | awk -F '"' '{print $2}')
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="1.0.3"
          fi
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="v${VERSION_NAME}"
          fi
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "Resolved Tag: $TAG_NAME, Version: $VERSION_NAME"

      - name: Prepare APK Artifacts
        run: |
          mkdir -p artifacts
          APK_SRC="app/build/outputs/apk/debug/app-debug.apk"
          cp "$APK_SRC" "artifacts/adb-toolbox-${TAG_NAME}.apk"
          cp "$APK_SRC" "artifacts/adb-toolbox-latest.apk"
          cp "$APK_SRC" "artifacts/ADBToolbox-debug-${TAG_NAME}.apk"
          cp "$APK_SRC" "artifacts/ADBToolbox-debug.apk"
          ls -lh artifacts/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ADBToolbox-APK
          path: artifacts/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        if: (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.TAG_NAME }}
          target_commitish: ${{ github.sha }}
          files: artifacts/*.apk
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
